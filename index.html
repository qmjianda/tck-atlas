<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="tCK Atlas：用可交互的时序波形解释 DDR4 / DDR5 关键时序参数。" data-i18n-content="meta.description">
  <meta name="theme-color" content="#f2f6fb">
  <title data-i18n="meta.title">tCK Atlas · DDR4 / DDR5 时序参数图谱</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2309131c'/%3E%3Cpath d='M15 40V26h8v14h8V18h8v22h8V30h4' fill='none' stroke='%23f4b860' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    (function () {
      var saved = null;
      var lang = '';
      try {
        saved = window.localStorage.getItem('tck-atlas-theme') || window.localStorage.getItem('ddr-atlas-theme');
        lang = window.localStorage.getItem('tck-atlas-lang') || '';
      } catch (error) {}
      var theme = saved === 'light' || saved === 'dark'
        ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#070d17' : '#f2f6fb');
      if (lang !== 'zh' && lang !== 'en') {
        lang = (/^en/i.test(navigator.language || '') ? 'en' : 'zh');
      }
      window.__TCK_LANG = lang;
      document.documentElement.setAttribute('data-lang', lang);
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="lab.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-chip" viewBox="0 0 24 24">
        <rect x="6" y="6" width="12" height="12" rx="1.6"></rect>
        <path d="M9.5 3.2v2.4M14.5 3.2v2.4M9.5 18.4v2.4M14.5 18.4v2.4M3.2 9.5h2.4M3.2 14.5h2.4M18.4 9.5h2.4M18.4 14.5h2.4"></path>
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.8" cy="10.8" r="6.6"></circle>
        <path d="m16 16 4.2 4.2"></path>
      </symbol>
      <symbol id="i-grid" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="7" height="7" rx="1.2"></rect>
        <rect x="13.5" y="3.5" width="7" height="7" rx="1.2"></rect>
        <rect x="3.5" y="13.5" width="7" height="7" rx="1.2"></rect>
        <rect x="13.5" y="13.5" width="7" height="7" rx="1.2"></rect>
      </symbol>
      <symbol id="i-wave" viewBox="0 0 24 24">
        <path d="M2.8 12h3.4V6.5h4.6v11h4.5V9h5.9"></path>
      </symbol>
      <symbol id="i-calc" viewBox="0 0 24 24">
        <rect x="5" y="2.8" width="14" height="18.4" rx="2"></rect>
        <path d="M8.2 6.7h7.6M8.5 11.2h.1M12 11.2h.1M15.5 11.2h.1M8.5 14.7h.1M12 14.7h.1M15.5 14.7h.1M8.5 18.1h.1M12 18.1h.1M15.5 18.1h.1"></path>
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24">
        <path d="M4 7h16M4 12h16M4 17h16"></path>
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4.1"></circle>
        <path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M18.5 5.5 17 7M7 17l-1.5 1.5"></path>
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24">
        <path d="M20.2 15.1A8.6 8.6 0 0 1 8.9 3.8 7.7 7.7 0 1 0 20.2 15.1Z"></path>
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M18 6 6 18"></path>
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M5 12h14M14 7l5 5-5 5"></path>
      </symbol>
      <symbol id="i-back" viewBox="0 0 24 24">
        <path d="M19 12H5M10 7l-5 5 5 5"></path>
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="M8 5.2v13.6L19 12 8 5.2Z" fill="currentColor" stroke="none"></path>
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24">
        <path d="M8 5v14M16 5v14" stroke-width="2.2"></path>
      </symbol>
      <symbol id="i-pin" viewBox="0 0 24 24">
        <path d="m12 3 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L12 3Z"></path>
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 10.8v5.4M12 7.6v.1"></path>
      </symbol>
    </defs>
  </svg>

  <div class="site-noise" aria-hidden="true"></div>
  <div class="site-glow site-glow--cyan" aria-hidden="true"></div>
  <div class="site-glow site-glow--amber" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar__left">
      <button class="icon-button menu-button" id="menuButton" type="button" aria-label="打开参数目录" data-i18n-aria="topbar.menu" aria-expanded="false" aria-controls="sidebar">
        <svg><use href="#i-menu"></use></svg>
      </button>
      <a class="brand" href="#/p/trcd" aria-label="tCK Atlas 首页" data-i18n-aria="topbar.brandHome">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 40 40">
            <rect x="5.5" y="5.5" width="29" height="29" rx="7"></rect>
            <path d="M10 25V17h4.2v8h3.1V12h4.4v13h2.8v-6.2H30"></path>
            <path d="M12 5.5V2.8M20 5.5V2.8M28 5.5V2.8M12 34.5v2.7M20 34.5v2.7M28 34.5v2.7"></path>
          </svg>
        </span>
        <span class="brand__copy">
          <strong>tCK ATLAS</strong>
          <span>DDR TIMING <i>v1.0</i></span>
        </span>
      </a>
    </div>

    <nav class="view-nav" aria-label="主视图" data-i18n-aria="topbar.views">
      <button class="view-tab is-active" type="button" data-view="atlas" aria-label="参数图谱" title="参数图谱" data-i18n-aria="nav.atlas" data-i18n-title="nav.atlas">
        <svg><use href="#i-grid"></use></svg>
        <span data-i18n="nav.atlas">参数图谱</span>
      </button>
      <button class="view-tab" type="button" data-view="sequence" aria-label="完整时序" title="完整时序" data-i18n-aria="nav.sequence" data-i18n-title="nav.sequence">
        <svg><use href="#i-wave"></use></svg>
        <span data-i18n="nav.sequence">完整时序</span>
      </button>
      <button class="view-tab" type="button" data-view="calculator" aria-label="换算器" title="换算器" data-i18n-aria="nav.calc" data-i18n-title="nav.calc">
        <svg><use href="#i-calc"></use></svg>
        <span data-i18n="nav.calc">换算器</span>
      </button>
      <button class="view-tab" type="button" data-view="lab" aria-label="配置档" title="配置档" data-i18n-aria="nav.lab" data-i18n-title="nav.lab">
        <svg><use href="#i-chip"></use></svg>
        <span data-i18n="nav.lab">配置档</span>
      </button>
    </nav>

    <div class="topbar__right">
      <span class="reference-state"><i></i>FIELD REFERENCE</span>
      <span class="scope-badge">DDR4 <b>/</b> DDR5</span>
      <div class="lang-switch" role="group" data-i18n-aria="topbar.language">
        <button class="lang-switch__option" type="button" data-lang="zh" aria-pressed="true" aria-label="中文" data-i18n-aria="lang.zh">中</button>
        <button class="lang-switch__option" type="button" data-lang="en" aria-pressed="false" aria-label="English" data-i18n-aria="lang.en">EN</button>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换到暗色主题" title="切换到暗色主题">
        <svg class="theme-toggle__icon" aria-hidden="true"><use href="#i-moon"></use></svg>
        <span class="theme-toggle__label" data-theme-label>暗色</span>
      </button>
    </div>
  </header>

  <div class="workspace">
    <div class="sidebar-scrim" id="sidebarScrim"></div>
    <aside class="sidebar" id="sidebar" aria-label="参数目录" data-i18n-aria="sidebar.head">
      <div class="sidebar__mobile-head">
        <span data-i18n="sidebar.head">参数目录</span>
        <button class="icon-button" id="sidebarClose" type="button" aria-label="关闭参数目录" data-i18n-aria="sidebar.close">
          <svg><use href="#i-close"></use></svg>
        </button>
      </div>

      <div class="search-box">
        <svg><use href="#i-search"></use></svg>
        <input id="paramSearch" type="search" placeholder="搜索参数 / 中文名 / 别名" data-i18n-placeholder="sidebar.searchPlaceholder" autocomplete="off" spellcheck="false" aria-label="搜索时序参数" data-i18n-aria="sidebar.searchAria">
        <kbd>/</kbd>
      </div>

      <div class="index-meta">
        <span>PARAMETER INDEX</span>
        <span id="resultCount">16 ENTRIES</span>
      </div>

      <nav class="param-nav" id="paramNav"></nav>

      <div class="search-empty" id="searchEmpty" hidden>
        <span class="search-empty__code">NO MATCH</span>
        <p data-i18n="sidebar.noMatch">没有找到对应参数。</p>
        <button type="button" id="clearSearch" data-i18n="sidebar.clear">清除搜索</button>
      </div>

      <div class="sidebar-note">
        <div class="sidebar-note__icon">
          <svg><use href="#i-info"></use></svg>
        </div>
        <p data-i18n="sidebar.note">波形均为教学示意，时间轴不一定等比例。设计签署请以 JEDEC 标准与具体器件 datasheet 为准。</p>
        <span>JEDEC DDR4 / DDR5 FIELD NOTES</span>
      </div>
    </aside>

    <main class="main" id="mainContent">
      <div class="view is-active" id="atlasView"></div>
      <div class="view" id="sequenceView" hidden></div>
      <div class="view" id="calculatorView" hidden></div>
      <div class="view" id="labView" hidden></div>
      <noscript>
        <p class="noscript" data-i18n="noscript">此工具需要启用 JavaScript 才能渲染交互式时序波形。</p>
      </noscript>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="data.js"></script>
  <script src="lab.js"></script>
  <script src="app.js"></script>
</body>
</html>
